[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trident-npp-workbench"
version = "3.7.2"
description = "TRIDENT: Marine NPP workbench for OSU CAFE validation and future Earthdata/Copernicus production workflows."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "pyyaml>=6",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.37",
  "requests>=2.31"
]

[project.optional-dependencies]
hdf4 = ["pyhdf>=0.11"]
dev = ["pytest>=8"]
production = ["earthaccess==0.18.0", "copernicusmarine==2.4.1", "dask==2026.6.0"]

[project.scripts]
trident = "trident.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
